<main class="playground">
  <header class="playground__header">
    <h1>Playground</h1>
    <p>
      Laboratorio interno de <code>@romanmartinidev/components</code>. Renderiza
      <code>&lt;rmd-button&gt;</code> consumiendo tokens <code>--ds-*</code> desde
      <code>@romanmartinidev/tokens</code>.
    </p>
  </header>

  <section class="playground__section">
    <h2>Variants</h2>
    <div class="playground__row">
      <rmd-button variant="primary" (clicked)="handleClick('primary')">Primary</rmd-button>
      <rmd-button variant="secondary" (clicked)="handleClick('secondary')">Secondary</rmd-button>
      <rmd-button variant="ghost" (clicked)="handleClick('ghost')">Ghost</rmd-button>
    </div>
  </section>

  <section class="playground__section">
    <h2>Sizes</h2>
    <div class="playground__row">
      <rmd-button size="sm" (clicked)="handleClick('sm')">Small</rmd-button>
      <rmd-button size="md" (clicked)="handleClick('md')">Medium</rmd-button>
      <rmd-button size="lg" (clicked)="handleClick('lg')">Large</rmd-button>
    </div>
  </section>

  <section class="playground__section">
    <h2>Disabled</h2>
    <div class="playground__row">
      <rmd-button [disabled]="true" (clicked)="handleClick('should-not-fire')">
        Primary disabled
      </rmd-button>
      <rmd-button variant="secondary" [disabled]="true">Secondary disabled</rmd-button>
    </div>
  </section>
</main>
