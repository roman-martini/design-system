<div class="shell">
  <header class="shell__header">
    <div class="shell__intro">
      <h1>Showcase</h1>
      <p>
        Casos de uso de <code>@romanmartinidev/components</code>, consumiendo tokens
        <code>--ds-*</code> de <code>@romanmartinidev/tokens</code>.
      </p>
    </div>
    <app-theme-switcher />
  </header>

  <!-- El prototipo del hito H1 va en su propio nav: no es un componente del
       catálogo, es una pantalla construida con el kit (D-023). -->
  <nav class="shell__nav shell__nav--prototype" aria-label="Prototipos">
    <a
      class="shell__link shell__link--prototype"
      routerLink="/prototipo"
      routerLinkActive="shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Prototipo (H1)
    </a>
  </nav>

  <nav class="shell__nav" aria-label="Componentes">
    <ul class="shell__list">
      @for (entry of entries; track entry.slug) {
      <li>
        <a
          class="shell__link"
          [routerLink]="['/', entry.slug]"
          routerLinkActive="shell__link--active"
          ariaCurrentWhenActive="page"
        >
          {{ entry.label }}
        </a>
      </li>
      }
    </ul>
  </nav>

  <main #main class="shell__content" tabindex="-1">
    <router-outlet />
  </main>
</div>
