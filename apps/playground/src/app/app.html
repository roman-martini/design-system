<div class="shell">
  <header class="shell__header">
    <div class="shell__intro">
      <h1>Showcase</h1>
      <p>
        Casos de uso de <code>@romanmartinidev/components</code>, consumiendo tokens
        <code>--ds-*</code> de <code>@romanmartinidev/tokens</code>.
      </p>
    </div>
    <app-theme-switcher />
  </header>

  <nav class="shell__nav" aria-label="Componentes">
    <ul class="shell__list">
      @for (entry of entries; track entry.slug) {
      <li>
        <a
          class="shell__link"
          [routerLink]="['/', entry.slug]"
          routerLinkActive="shell__link--active"
          ariaCurrentWhenActive="page"
        >
          {{ entry.label }}
        </a>
      </li>
      }
    </ul>
  </nav>

  <main #main class="shell__content" tabindex="-1">
    <router-outlet />
  </main>
</div>
