schema: spec-driven

context: |
  Language: Español. All artifacts must be written in Español; code and identifiers in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  design-system: monorepo pnpm de librerías publicables bajo `@romanmartinidev`, para apps Angular consumidoras.
  Packages: `packages/tokens` (design tokens, Style Dictionary 4, CSS vars `--ds-*`, Figma opcional) y
  `packages/components` (Angular 21 standalone + signals, ng-packagr/APF). `apps/playground` (zoneless +
  Storybook 10 + Vitest 4) valida las libs; no es publicable. TypeScript 5.9, Changesets lockstep pre-1.0.

  Naming (ADR-007): selector `ds-<name>`, clase `Ds<Name>` sin sufijo Component, types `Ds<Name><Type>`,
  archivos kebab-case sin sufijo de rol (`button/button.ts`).
  Tokens (ADR-003): primitives → semantic → component → theme; theme solo redefine semantic; sin ciclos.
  Dependencias (spec monorepo-structure): tokens no depende de nada; components → tokens como peerDependency
  `workspace:*`; playground → ambos; nunca hacia playground.

  Specs describen comportamiento observable y testable; el cómo (effect, viewChild, CSS) va a design o tasks.
  Prefer positive SHALL statements over negative ones when both express the same contract.

  Changes llevan `id: aaa-NNN` permanente en el frontmatter y `status: proposed` mientras están en curso
  (con `active`, `validate --all` de CI los ignora). Próximo ID, IDs en vuelo y frontmatter: `openspec/README.md`.
  Dentro de artefactos de change nunca usar links markdown relativos (archivar los rompe): referenciar por ID
  (ADR-NNN, D-NNN, HU-NNN, EP-NNN, CA-NNN.Y, aaa-NNN), specs por carpeta, y archivos sin ID por path en código inline.

rules:
  # Claves válidas: solo ids de artefactos del schema (proposal, specs, design, tasks). Una clave como
  # "all-artifacts" no existe: el CLI la ignora con warning. Lo transversal va en `context`.
  proposal:
    - Antes de redactar leer docs/architecture/ARCHITECTURE.md, decisions-log.md, openspec/README.md y docs/backlog/BACKLOG.md
    - Declarar cuál de las 3 prioridades del repo respalda la propuesta (buenas prácticas > escala ordenada > mantenibilidad)
    - Incluir sección "Alternativas evaluadas" con al menos 2 opciones descartadas y su porqué
    - Si toca 2 o más packages o es one-way door, declarar que generará un ADR al cerrarse; nunca contradecir un ADR aceptado sin supersede explícito
    - Si nace de una decisión o HU, enlazarla en el frontmatter con related-decisions (D-NNN) y citar la HU en el texto

  specs:
    - Antes de redactar leer la spec base correspondiente
    - Componente nuevo → introduces-specs component-<name> con ADDED; existente → modifies-specs component-<name> con MODIFIED; transversal al package o a 2+ componentes → components-package (ADR-018)
    - Para deltas usar ADDED, MODIFIED (contenido completo del requirement), REMOVED (con Reason + Migration) o RENAMED
    - Naming siempre con los prefijos vigentes Ds<Name> / ds-<name>, nunca los históricos

  design:
    - Antes de redactar leer proposal.md y los ADRs listados en related-adrs
    - Por cada decisión documentar las alternativas evaluadas con su porqué; las one-way door se promueven a ADR al archivar

  tasks:
    # Cada regla debe ser un string YAML: una línea con ": " sin comillas se vuelve mapping y el CLI
    # descarta todas las reglas del artefacto ("must be an array of strings").
    - Antes de redactar leer proposal.md, design.md y los deltas en specs/
    - Tareas en chunks de hasta 2 horas con criterio de aceptación binario
    - Última tarea de implementación siempre es proponer el mensaje de commit y esperar OK explícito del PO
    - Incluir tarea de validación final con openspec validate --all, lint, format:check, typecheck, build, tests, storybook build y npm pack
    - 'Incluir tarea final de archive con el checklist completo de docs/product/README.md § "Checklist de archive" (spec base, sin links relativos, openspec/README.md, catalog.md, HU y épica, README de producto, BACKLOG)'
    - 'En changes de componente la tarea de archive queda bloqueada hasta el OK visual explícito del PO (D-022)'

operations:
  apply:
    guidance:
      - Implementar las tasks en orden marcando checkboxes; no marcar una task sin cumplir su criterio binario
      - Nunca commitear sin proponer el mensaje y esperar OK explícito del PO; stagear solo paths explícitos
      - Si una task pide apartarse de un ADR aceptado, parar y decirlo (el camino es un ADR nuevo, no una excepción silenciosa)
  archive:
    guidance:
      - Seguir el checklist completo de docs/product/README.md § "Checklist de archive"
      - Renombrar el directorio a <id>-<name> al moverlo a openspec/changes/archive/ (ADR-008) y sincronizar la spec base con los deltas
      - Verificar que los artefactos archivados no tengan links markdown relativos (referencias por ID)
      - Actualizar openspec/README.md (próximo ID e IDs en vuelo), docs/architecture/catalog.md, la HU y su épica, el README de producto y el BACKLOG
      - En changes de componente el archive queda bloqueado hasta el OK visual explícito del PO (D-022)
