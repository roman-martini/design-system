name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Requerido para emitir la attestation de procedencia (npm provenance) al
  # publicar desde Actions, junto con publishConfig.provenance en los packages (D-018c).
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history para changesets/action
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build (recursive)
        run: pnpm -r build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # OJO: `pnpm version` es un builtin de pnpm que pisa al script
          # homónimo — invocar changesets directo, sin ambigüedad.
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore(repo): version packages'
          title: 'chore(repo): version packages'
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
