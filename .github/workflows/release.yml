name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Modo 1 — hay changesets pendientes: abrir/actualizar el PR de versionado.
  # Sin gate de aprobación: la operación es reversible y ocurre en cada merge.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history para changesets/action
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: pnpm changeset:version
          commit: 'chore(repo): version packages'
          title: 'chore(repo): version packages'
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Modo 2 — no quedan changesets (se mergeó el PR de versionado): publicar.
  # El acto es irreversible (npm no permite republicar una versión), así que
  # queda detrás del environment `npm-publish` con required reviewer (D-018b).
  # NPM_TOKEN es secret DE ESE ENVIRONMENT: ningún otro job puede leerlo.
  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      # write: changeset publish pushea los tags de release y crea los GitHub releases.
      contents: write
      # Requerido para emitir la attestation de procedencia (npm provenance) al
      # publicar desde Actions, junto con publishConfig.provenance en los packages (D-018c).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build (recursive)
        run: pnpm -r build

      - name: Publish to npm
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish: pnpm changeset publish
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
