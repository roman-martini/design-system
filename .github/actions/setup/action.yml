name: 'Setup'
description: 'Setup pnpm + Node (desde .nvmrc) + install con frozen lockfile y cache de pnpm'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      # version: omitida intencionalmente — se infiere del campo `packageManager` del root package.json

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
