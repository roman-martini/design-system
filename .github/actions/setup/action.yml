name: 'Setup'
description: 'Setup pnpm + Node (desde .nvmrc) + install con frozen lockfile y cache de pnpm'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # version: omitida intencionalmente — se infiere del campo `packageManager` del root package.json

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        # Explícito a propósito: desde setup-node v5 hay caching automático por
        # `packageManager`, pero v6 lo limitó a npm. Declararlo manda en toda versión.
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
