project:
  name: avain-angular-ui-kit
  description: >
    UI Kit interno de AVAIN. Monorepo Angular con dos librerías publicables:
    @avain/ngx-ui (componentes Angular standalone) y @avain/ngx-theming (tokens SCSS en capas).

tech:
  framework: Angular 21.1.x
  language: TypeScript ~5.9.3
  styling: SCSS (3-layer token system)
  build: ng-packagr
  package_manager: npm

architecture:
  token_layers:
    - primitive    # --color-blue-400
    - semantic     # --color-primary
    - components   # --button-primary-bg
  component_rules:
    - standalone: true (sin NgModules)
    - selector_prefix: ngx-
    - class_prefix: Ngx
    - types_in_separate_file: "{name}.types.ts"
    - api: "@Input() semánticos — nunca exponer clases CSS"
    - tokens: nunca hardcodear valores, siempre referenciar capa inferior

packages:
  - name: "@avain/ngx-ui"
    path: projects/ngx-ui/
    description: Componentes Angular standalone
  - name: "@avain/ngx-theming"
    path: projects/ngx-theming/
    description: Tokens SCSS en capas (primitive, semantic, components)
  - name: demo-app
    path: projects/demo-app/
    description: App de validación visual

conventions:
  commits: Conventional Commits con scope (feat(button):, fix(input):, chore(theming):)
  files: kebab-case
  components: BEM para clases CSS internas

ai_tools:
  - claude

existing_commands:
  - /new-component  # scaffold de componente Angular standalone
  - /new-token      # agrega token en capa primitive/semantic/components
  - /audit-tokens   # verifica consistencia de la cadena de tokens
  - /publish        # guía de release para ngx-ui o ngx-theming
