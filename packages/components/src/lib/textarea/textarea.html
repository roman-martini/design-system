@if (label()) {
<label class="ds-field__label" [for]="fieldId">{{ label() }}</label>
}
<div
  class="ds-field__control ds-field__control--textarea"
  [attr.data-size]="size()"
  [attr.data-resize]="resize()"
  [class.ds-field__control--invalid]="isInvalid()"
  [class.ds-field__control--disabled]="disabled()"
>
  <textarea
    [id]="fieldId"
    [rows]="rows()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-invalid]="isInvalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
</div>
<!-- Live region siempre presente: anuncia la aparición del error sin interrumpir. -->
<p class="ds-field__error" [id]="errorId" aria-live="polite">@if (showError()) { {{ error() }} }</p>
@if (hint() && !showError()) {
<p class="ds-field__hint" [id]="hintId">{{ hint() }}</p>
}
